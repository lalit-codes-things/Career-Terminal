;;;
;;; PgBouncer configuration — ApplyWise
;;;
;;; This file is used by the bitnami/pgbouncer Docker image.
;;; All connection credentials are injected via environment variables
;;; in docker-compose.yml; this file only defines pool behaviour.
;;;
;;; Transaction pooling is required for Prisma compatibility:
;;;   https://www.prisma.io/docs/guides/performance-and-optimization/connection-management/configure-pg-bouncer
;;;
;;; Connection string for Prisma (add ?pgbouncer=true&connection_limit=1):
;;;   postgresql://USER:PASS@pgbouncer:6432/DATABASE?pgbouncer=true&connection_limit=1
;;;

[databases]
; Bitnami's entrypoint builds this section from env vars — leave empty here.
; POSTGRESQL_HOST, POSTGRESQL_DATABASE, etc. are read at container start.

[pgbouncer]
; ── Network ────────────────────────────────────────────────────────────────
listen_addr     = 0.0.0.0
listen_port     = 6432

; ── Authentication ──────────────────────────────────────────────────────────
auth_type       = scram-sha-256
auth_file       = /opt/bitnami/pgbouncer/conf/userlist.txt

; ── Pooling ─────────────────────────────────────────────────────────────────
; Transaction pooling — the only mode compatible with Prisma.
; Session and statement modes will break prepared statements.
pool_mode       = transaction

; ── Pool sizing ─────────────────────────────────────────────────────────────
; max_client_conn: maximum simultaneous connections from clients (apps).
; default_pool_size: how many server connections to open per user+db pair.
; min_pool_size: keep at least this many server connections open.
; reserve_pool_size: extra connections for sudden load spikes.
max_client_conn         = 200
default_pool_size       = 20
min_pool_size           = 5
reserve_pool_size       = 5
reserve_pool_timeout    = 3.0

; ── Timeouts ────────────────────────────────────────────────────────────────
server_connect_timeout  = 15
server_idle_timeout     = 600
client_idle_timeout     = 0
query_timeout           = 0
query_wait_timeout      = 30

; ── Prisma compatibility ─────────────────────────────────────────────────────
; Prisma sends extra_float_digits=3 on connection; ignore it.
ignore_startup_parameters = extra_float_digits

; ── Logging ──────────────────────────────────────────────────────────────────
log_connections  = 0
log_disconnections = 0
log_pooler_errors = 1

; ── Admin ────────────────────────────────────────────────────────────────────
; Admin console is disabled in production.
; To enable locally: admin_users = pgbouncer
