apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: career-terminal-api
  namespace: career-terminal
  labels:
    app: career-terminal-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: career-terminal-api
  minReplicas: 3
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
