# Secret template — DO NOT commit real values.
# Copy to secret.yaml, fill values (base64-encoded), apply with:
#   kubectl apply -f k8s/secret.yaml -n career-terminal
apiVersion: v1
kind: Secret
metadata:
  name: career-terminal-secrets
  namespace: career-terminal
  labels:
    app: career-terminal-api
type: Opaque
data:
  DATABASE_URL: <base64-encoded-value>
  JWT_SECRET: <base64-encoded-value>
  ENCRYPTION_KEY: <base64-encoded-value>
  INTERNAL_API_KEY: <base64-encoded-value>
  REDIS_PASSWORD: <base64-encoded-value>
  GOOGLE_CLIENT_ID: <base64-encoded-value>
  GOOGLE_CLIENT_SECRET: <base64-encoded-value>
  GOOGLE_REDIRECT_URI: <base64-encoded-value>
  AWS_ACCESS_KEY_ID: <base64-encoded-value>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-value>
  POSTGRES_PASSWORD: <base64-encoded-value>
