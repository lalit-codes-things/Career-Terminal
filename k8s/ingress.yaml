apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: career-terminal-api
  namespace: career-terminal
  labels:
    app: career-terminal-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.career-terminal.io
      secretName: career-terminal-tls
  rules:
    - host: api.career-terminal.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: career-terminal-api
                port:
                  number: 80
