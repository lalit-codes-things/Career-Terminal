apiVersion: v1
kind: ResourceQuota
metadata:
  name: applywise-resource-quota
  namespace: applywise
  labels:
    app: applywise-api
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
    services: "5"
    configmaps: "5"
    secrets: "5"
    persistentvolumeclaims: "5"
