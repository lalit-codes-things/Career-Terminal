apiVersion: v1
kind: LimitRange
metadata:
  name: applywise-limit-range
  namespace: applywise
  labels:
    app: applywise-api
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
    - type: PersistentVolumeClaim
      defaultRequest:
        storage: "1Gi"
      default:
        storage: "10Gi"
