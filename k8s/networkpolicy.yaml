apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: career-terminal-api-netpol
  namespace: career-terminal
  labels:
    app: career-terminal-api
spec:
  podSelector:
    matchLabels:
      app: career-terminal-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: career-terminal-api
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
    - ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 9000
