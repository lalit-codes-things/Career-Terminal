apiVersion: v1
kind: ConfigMap
metadata:
  name: career-terminal-config
  namespace: career-terminal
  labels:
    app: career-terminal-api
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  AWS_REGION: "us-east-1"
  # S3_KMS_KEY_ID is injected via secret (production) — leave absent in configmap.
  # The app falls back to AES256 SSE when unset (dev/test only).
  POSTGRES_DB: "career-terminal"
  POSTGRES_USER: "career-terminal"
  MINIO_BUCKET: "career-terminal-resumes"
  LOG_LEVEL: "info"
  DATABASE_CONNECTION_LIMIT: "5"
  DATABASE_POOL_TIMEOUT: "10"
  DATABASE_CONNECT_TIMEOUT: "10"
  WORKER_CONCURRENCY: "5"
  WORKER_SHUTDOWN_TIMEOUT: "30000"
