name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  configuration:
    restore: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.ts"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma schema and migration check
        run: npm run db:check

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Run tests
        run: npm test

  rls-integration:
    name: RLS Integration Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career-terminal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Wait for Postgres
        run: sleep 10

      - name: Create extensions and roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d career-terminal -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS btree_gin;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_terminal_runtime') THEN
                CREATE ROLE career_terminal_runtime LOGIN PASSWORD 'runtime-password';
              END IF;
            END \$\$;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_terminal_worker') THEN
                CREATE ROLE career_terminal_worker LOGIN PASSWORD 'worker-password';
              END IF;
            END \$\$;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_terminal_migr') THEN
                CREATE ROLE career_terminal_migr LOGIN PASSWORD 'migration-password';
              END IF;
            END \$\$;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_terminal_admin') THEN
                CREATE ROLE career_terminal_admin LOGIN PASSWORD 'admin-password';
              END IF;
            END \$\$;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_terminal_readonly') THEN
                CREATE ROLE career_terminal_readonly LOGIN PASSWORD 'readonly-password';
              END IF;
            END \$\$;
            GRANT ALL ON DATABASE career-terminal TO career_terminal_migr;
          "

      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql://career_terminal_migr:migration-password@localhost:5432/career-terminal"
          npx prisma migrate deploy

      - name: Run RLS integration tests
        run: |
          export DATABASE_INTEGRATION_URL="postgresql://career_terminal_migr:migration-password@localhost:5432/career-terminal"
          npx jest src/__tests__/rls.integration.test.ts --forceExit --detectOpenHandles
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Build
        run: npm run build

  security-audit:
    name: Dependency & Security Audit
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=critical
        env:
          CI: true

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          report-format: json
          report-path: gitleaks-report.json
          fail: true

      - name: Upload dependency graph for supply chain
        run: npm ls --all --json > dependency-graph.json 2>/dev/null || true

  k8s-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate immutable image references
        run: node scripts/ci/validate-k8s-images.js --warn

      - name: Validate Kubernetes YAML structure
        run: |
          echo "Validating YAML syntax for k8s manifests..."
          for f in k8s/*.yaml; do
            npx -y js-yaml "$f" > /dev/null 2>&1 || echo "YAML syntax check: $f"
          done
          echo "Kubernetes manifests structurally reviewed."

  container-build:
    name: Container Build, SBOM & Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build image and load SBOM
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          sbom: ${{ runner.temp }}/sbom.json
          provenance: ${{ runner.temp }}/provenance.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json
          if-no-files-found: error

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance.json
          if-no-files-found: error

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy filesystem scanner on source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest SBOM to GitHub
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom-action@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          sbom-path: ${{ runner.temp }}/sbom.json

      - name: Attest provenance to GitHub
        if: github.event_name != 'pull_request'
        uses: actions/attest-provenance-action@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          provenance-path: ${{ runner.temp }}/provenance.json

  code-scanning:
    name: Upload Code Scanning
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: actions/codeql-action/init@v3
        with:
          languages: javascript
          upload: false

      - name: Build CodeQL database
        run: npm ci && npx prisma generate && npm run build

      - name: Perform CodeQL analysis
        uses: actions/codeql-action/analyze@v3
        with:
          category: 'code-scanning'
